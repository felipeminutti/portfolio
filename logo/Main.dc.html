<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
<script>
(function(){
function restart(){
var cols=document.querySelectorAll('.col');
for(var i=0;i<cols.length;i++){cols[i].style.animation='none';}
void document.body.offsetWidth;
for(var k=0;k<cols.length;k++){cols[k].style.animation='';}
}
document.addEventListener('mouseover',function(e){
var logo=e.target&&e.target.closest?e.target.closest('[data-logo]'):null;
if(!logo)return;
if(e.relatedTarget&&logo.contains(e.relatedTarget))return;
restart();
});
})();
</script>
