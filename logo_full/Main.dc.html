<div role="img" aria-label="Logo MINUTTI: colunas que sobem e descem para formar M, I, N, U, T, T, I em loop" style="width:1600px;height:600px;box-sizing:border-box;background:#ffffff;display:flex;align-items:center;justify-content:center;overflow:hidden">
<div data-logo="" style="padding:60px;cursor:pointer;display:flex;align-items:center;flex:none;transform:scale(var(--s,.47))">
<div aria-hidden="true" style="position:relative;width:360px;height:360px;overflow:hidden;flex:none">

<svg class="word" width="2650" height="360" viewBox="0 0 2650 360" style="display:block;overflow:visible"><text x="0" y="360" font-family="Akshar, 'Arial Narrow', sans-serif" font-size="500" fill="#0b0b0b"><tspan font-weight="600">MINUTTI</tspan><tspan font-weight="300">STUDIO</tspan></text></svg>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
<script>
(function(){
function fit(){
var svg=document.querySelector('.word');if(!svg)return;
var t=svg.querySelector('text');
var c=document.createElement('canvas').getContext('2d');
c.font='600 200px Akshar, sans-serif';
var cap=c.measureText('M').actualBoundingBoxAscent||144;
var fs=200*360/cap;
t.setAttribute('font-size',fs);
var w=t.getBBox().width;
svg.setAttribute('width',w);svg.setAttribute('viewBox','0 0 '+w+' 360');
var total=120+360+141+w;
var s=Math.min(1,1480/total);
var lg=document.querySelector('[data-logo]');
if(lg)lg.style.setProperty('--s',s);
}
if(document.fonts&&document.fonts.load){
Promise.all([document.fonts.load('600 100px Akshar'),document.fonts.load('300 100px Akshar')]).then(fit,fit);
}
setTimeout(fit,50);
function restart(){
var cols=document.querySelectorAll('.col');
for(var i=0;i<cols.length;i++){cols[i].style.animation='none';}
void document.body.offsetWidth;
for(var k=0;k<cols.length;k++){cols[k].style.animation='';}
}
document.addEventListener('mouseover',function(e){
var logo=e.target&&e.target.closest?e.target.closest('[data-logo]'):null;
if(!logo)return;
if(e.relatedTarget&&logo.contains(e.relatedTarget))return;
restart();
});
})();
</script>
